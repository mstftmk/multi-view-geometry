[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-view-geometry"
version = "0.1.0"
description = "Photogrammetry and multiple view geometry written from scratch in NumPy: features, homographies, calibration, two-view geometry, stereo, PnP and bundle adjustment"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mustafa Tomak" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "opencv-python-headless>=4.8", "scikit-image>=0.20"]
figures = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# `l` is kept where the derivations use it: a line in homogeneous coordinates, or a scale-space layer.
ignore = ["E741"]
